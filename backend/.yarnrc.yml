# Prisma's engine binaries are mutated at runtime (chmod/unlink), which fails
# under PnP's read-only zip store with EROFS. Use the classic node_modules linker.
nodeLinker: node-modules

# Yarn >=4.14 disables install/build scripts by default. Prisma needs its
# postinstall to generate the client into node_modules.
enableScripts: true
